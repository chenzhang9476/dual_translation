services:
  dual-translation:
    build:
      context: .
      dockerfile: Dockerfile
    image: dual-translation:gpu
    container_name: dual-translation-gpu
    working_dir: /workspace
    volumes:
      - ../:/workspace
    gpus: all
    shm_size: "16gb"
    ipc: host
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      CUDA_DEVICE_ORDER: PCI_BUS_ID
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True,max_split_size_mb:128
      OMP_NUM_THREADS: "1"
    tty: true
    stdin_open: true
    command: /bin/bash
